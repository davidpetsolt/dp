        <style>
            /* Half-Ass Shenanigans lock screen. HAS design system: Pool teal ground, David blue, orange sun, navy pen. */
            :root {
                --pool: #57cecb;
                --david: #008eff;
                --orange: #ff6000;
                --ink: #1b2352;
                --ink-muted: #1f3058;
                --white: #ffffff;

            .staticrypt-html { height: 100%; }
            .staticrypt-body { height: 100%; margin: 0; }
            .staticrypt-content {
                min-height: 100%; margin: 0; background: var(--pool); color: var(--ink);
                font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased;
                display: flex; align-items: flex-start; justify-content: center; box-sizing: border-box; padding: 8vh 20px 80px; position: relative; overflow: hidden;
            }
            .staticrypt-content::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: var(--ink); }
            .lock-sun { position: absolute; right: 6vw; bottom: 8px; width: 240px; height: 120px; overflow: hidden; pointer-events: none; }
            .lock-sun::before { content: ""; position: absolute; left: 0; top: 0; width: 240px; height: 240px; border-radius: 9999px; background: var(--orange); }
            .staticrypt-page { width: 400px; max-width: 100%; text-align: left; position: relative; }
            .lock-logo { width: 120px; display: block; margin: 0 0 20px; }
            .lock-eyebrow { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 14px; }
            .lock-heading {
                display: inline-block; margin: 0 0 22px -12px; padding: 8px 12px 0; font-family: "Bebas Neue", "Oswald", Impact, sans-serif; font-weight: 400;
                font-size: 64px; line-height: .9; letter-spacing: .01em; text-transform: uppercase; color: var(--white); background: var(--david);
                -webkit-box-decoration-break: clone; box-decoration-break: clone; max-width: 100%;
            }
            .staticrypt-form {
                position: relative; z-index: 1; background: var(--white); border: 4px solid var(--ink); margin: 0; padding: 28px 28px 24px; text-align: left; box-shadow: 6px 6px 0 var(--ink);
            }
            .staticrypt-instructions p { margin: 0 0 6px; }
            .staticrypt-title { font-size: 12px; line-height: 16px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); font-weight: 700; }
            .staticrypt-form input[type="password"], input[type="text"] {
                background: inherit; border: 0; box-sizing: border-box; font-size: 16px; font-family: "DM Mono", Menlo, monospace; color: var(--ink); outline: 0; padding: 14px 44px 14px 14px; width: 100%;
            }
            .staticrypt-password-container { position: relative; outline: 0; background: var(--white); border: 4px solid var(--ink); width: 100%; margin: 16px 0 14px; box-sizing: border-box; }
            .staticrypt-password-container:focus-within { box-shadow: 0 0 0 2px var(--white), 0 0 0 5px var(--orange-text); }
            .staticrypt-toggle-password-visibility { cursor: pointer; height: 18px; opacity: 60%; padding: 13px; position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 18px; }
            label.staticrypt-remember { display: flex; align-items: center; margin-bottom: 1em; font-size: 14px; color: var(--ink); }
            .staticrypt-remember input[type="checkbox"] { transform: scale(1.35); margin-right: 0.9em; accent-color: var(--orange); }
            .staticrypt-form .staticrypt-decrypt-button {
                font-family: "Archivo", sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; outline: 0; background: var(--orange); width: 100%; border: 4px solid var(--orange); border-radius: 0; padding: 14px; color: #0e1230; font-size: 14px; cursor: pointer; transition: transform .1s ease, box-shadow .1s ease;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover, .staticrypt-form .staticrypt-decrypt-button:focus { box-shadow: 6px 6px 0 var(--ink); transform: translate(-2px, -2px); }
            .staticrypt-form .staticrypt-decrypt-button:active { box-shadow: none; transform: none; }
            .lock-footer { margin-top: 22px; font-family: "DM Mono", Menlo, monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
            .hidden { display: none !important; }
            .staticrypt-spinner-container { height: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--pool); }
            .staticrypt-spinner { display: inline-block; width: 2rem; height: 2rem; vertical-align: text-bottom; border: 0.25em solid var(--ink); border-right-color: var(--orange); border-radius: 50%; animation: spinner-border 0.75s linear infinite; }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
            @media screen and (-webkit-min-device-pixel-ratio: 0) { .staticrypt-form input[type="password"], input[type="text"] { font-size: 16px; } }
            @media (max-width: 480px) { .lock-heading { font-size: 52px; } .lock-sun { width: 160px; height: 80px; } .lock-sun::before { width: 160px; height: 160px; } }
