        <style>
            :root{
                --navy:#1b2352;
                --sun:#ff6000;
                --paper:#eef1f7;
                --card:#ffffff;
                --ink:#1b2352;
                --ink-soft:#5a6288;
                --rule:#d5dae7;
                --shadow:0 1px 0 rgba(27,35,82,.06), 0 8px 24px -16px rgba(27,35,82,.45);
            }
            *{box-sizing:border-box}
            html{-webkit-text-size-adjust:100%}
            .staticrypt-body{
                margin:0;min-height:100vh;
                background:var(--paper);color:var(--ink);
                font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
                font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
            }
            .hidden{display:none !important}

            /* spinner shown while staticrypt decrypts a remembered session */
            .staticrypt-spinner-container{display:grid;place-items:center;min-height:100vh}
            .staticrypt-spinner{
                width:34px;height:34px;border-radius:50%;
                border:3px solid var(--rule);border-top-color:var(--sun);
                animation:staticrypt-spin .8s linear infinite;
            }
            @keyframes staticrypt-spin{to{transform:rotate(360deg)}}
            @media (prefers-reduced-motion:reduce){.staticrypt-spinner{animation-duration:2.4s}}

            .staticrypt-page{display:grid;place-items:center;min-height:100vh;padding:24px 18px}
            .staticrypt-form{
                width:100%;max-width:380px;
                background:var(--card);border-radius:16px;padding:30px 26px 26px;
                box-shadow:var(--shadow);
            }
            .staticrypt-dots{display:flex;gap:7px;justify-content:center;margin:0 0 18px}
            .staticrypt-dots span{width:9px;height:9px;border-radius:50%;background:var(--rule)}
            .staticrypt-dots span:first-child{background:var(--sun)}
            .staticrypt-instructions{text-align:center}
            .staticrypt-title{
                font-size:2rem;font-variation-settings:"wdth" 116,"wght" 800;
                line-height:.95;letter-spacing:-.025em;margin:0 0 6px;
            }
            .staticrypt-instructions p:last-child{margin:0;color:var(--ink-soft);font-size:.92rem}
            .staticrypt-hr{border:0;border-top:1px solid var(--rule);margin:20px 0}

            .staticrypt-password-container{position:relative;display:flex;align-items:center}
            #staticrypt-password{
                width:100%;font-family:inherit;font-size:1rem;color:var(--ink);
                background:var(--paper);border:1px solid var(--rule);border-radius:10px;
                padding:12px 44px 12px 13px;
            }
            #staticrypt-password:focus{outline:2px solid var(--sun);outline-offset:1px;border-color:var(--sun)}
            .staticrypt-toggle-password-visibility{
                position:absolute;right:13px;width:19px;height:19px;
                cursor:pointer;opacity:.4;
            }
            .staticrypt-toggle-password-visibility:hover{opacity:.75}

            .staticrypt-remember{
                display:flex;align-items:center;gap:8px;
                margin:14px 0 0;font-size:.88rem;color:var(--ink-soft);cursor:pointer;
            }
            #staticrypt-remember{accent-color:var(--sun);width:15px;height:15px;cursor:pointer}

            .staticrypt-decrypt-button{
                width:100%;margin-top:18px;appearance:none;border:0;cursor:pointer;
                font-family:inherit;font-size:.95rem;font-variation-settings:"wght" 680;
                background:var(--sun);color:#fff;border-radius:10px;padding:13px;
                transition:filter .15s ease;
            }
            .staticrypt-decrypt-button:hover{filter:brightness(.93)}
            .staticrypt-decrypt-button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

            @media (prefers-color-scheme: dark){
                :root{
                    --paper:#10163a;--card:#1b2352;--ink:#eaedf7;--ink-soft:#9aa3c8;--rule:#2e3766;
                    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -18px rgba(0,0,0,.9);
                }
                .staticrypt-toggle-password-visibility{filter:invert(1);opacity:.5}
            }

                rememberExpirationKey: "staticrypt_expiration",

                clearLocalStorageCallback: null,

            // init the staticrypt engine
            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // try to automatically decrypt on load if there is a saved password

                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been

                if (!isSuccessful) {
                    // hide loading screen
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();

                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    alert(templateError);
                }
