                border-radius: 2px;

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: var(--cream);
                border: 2px solid var(--gold);
                border-radius: 6px;
                margin: 0 auto;
                padding: 34px 32px 30px;
                text-align: center;
                box-shadow: 6px 6px 0 rgba(15, 61, 92, 0.18);
            }

            .staticrypt-instructions p {
                margin: 0 0 6px;
            }

            .staticrypt-title {
                font-family: "IBM Plex Mono", monospace;
                font-size: 0.85em;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--paprika);
                font-weight: 500;
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box;
                font-size: 15px;
                font-family: "Archivo", sans-serif;
                color: var(--ink);
                outline: 0;
                padding: 14px 44px 14px 14px;
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #fff;
                border: 1.5px solid var(--blue);
                border-radius: 4px;
                width: 100%;
                margin: 18px 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-password-container:focus-within {
                border-color: var(--paprika);
                box-shadow: 0 0 0 3px rgba(212, 73, 31, 0.15);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                opacity: 55%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 18px;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
                font-size: 0.9em;
                color: var(--blue);
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.35);
                margin-right: 0.9em;
                accent-color: var(--paprika);
            }

            .staticrypt-form .staticrypt-decrypt-button {
                font-family: "Anton", sans-serif;
                text-transform: uppercase;
                letter-spacing: 0.12em;
                outline: 0;
                background: var(--paprika);
                width: 100%;
                border: 0;
                border-radius: 4px;
                padding: 14px;
                color: var(--cream);
                font-size: 16px;
                cursor: pointer;
                transition: background 0.15s ease, transform 0.1s ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: var(--blue);
            }

            .staticrypt-form .staticrypt-decrypt-button:active {
                transform: translateY(1px);
            }

            .lock-footer {
                margin-top: 22px;
                font-family: "IBM Plex Mono", monospace;
                font-size: 0.72em;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: var(--blue);
                opacity: 0.65;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--paper);

                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid var(--gold);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
