            :root {
                --paper: #f2ece0;
                --paper-2: #e7ddc9;
                --sumi: #1b1815;
                --vermilion: #c23b1f;
                --indigo: #1f3652;
                --gold: #c9932e;
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                min-height: 100%;
                margin: 0;
                background: var(--paper);
                font-family: "Noto Sans JP", sans-serif;
                color: var(--sumi);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                display: flex;
                align-items: flex-start;
                justify-content: center;
                box-sizing: border-box;
                padding: 12vh 20px 60px;
            }

            .staticrypt-page {
                width: 360px;
                max-width: 100%;
                text-align: center;
            }

            .lock-hanko {
                width: 64px;
                height: 64px;
                margin: 0 auto 20px;
                border-radius: 50%;
                background: var(--vermilion);
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 3px 3px 0 rgba(27, 24, 21, 0.18);
            }

            .lock-hanko span {
                font-family: "Noto Sans JP", sans-serif;
                color: var(--paper);
                font-size: 28px;
                font-weight: 700;
                line-height: 1;
            }

            .lock-heading {
                font-family: "Space Grotesk", sans-serif;
                font-size: 3.1em;
                letter-spacing: 0.14em;
                color: var(--sumi);
                margin: 0 0 6px;
                text-transform: uppercase;
                line-height: 1;
                font-weight: 700;
            }

            .lock-rule {
                width: 96px;
                height: 2px;
                margin: 14px auto 4px;
                border: 0;
                background: var(--sumi);
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: var(--paper);
                border: 1.5px solid var(--sumi);
                border-radius: 2px;
                margin: 24px auto 0;
                padding: 32px 30px 28px;
                text-align: center;
                box-shadow: 6px 6px 0 var(--sumi);
            }

            .staticrypt-instructions p {
                margin: 0 0 6px;
            }

            .staticrypt-title {
                font-family: "Noto Sans JP", sans-serif;
                font-size: 0.9em;
                letter-spacing: 0.06em;
                color: var(--indigo);
                font-weight: 500;
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box;
                font-size: 15px;
                font-family: "Space Grotesk", sans-serif;
                font-variant-numeric: tabular-nums;
                color: var(--sumi);
                outline: 0;
                padding: 14px 44px 14px 14px;
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: var(--paper);
                border: 1px solid var(--sumi);
                border-radius: 2px;
                width: 100%;
                margin: 18px 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-password-container:focus-within {
                border-color: var(--vermilion);
                box-shadow: 0 0 0 3px rgba(194, 59, 31, 0.15);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                opacity: 55%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 18px;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
                font-size: 0.9em;
                color: var(--indigo);
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.35);
                margin-right: 0.9em;
                accent-color: var(--vermilion);
            }

            .staticrypt-form .staticrypt-decrypt-button {
                font-family: "Space Grotesk", sans-serif;
                text-transform: uppercase;
                letter-spacing: 0.14em;
                outline: 0;
                background: var(--sumi);
                width: 100%;
                border: 0;
                border-radius: 2px;
                padding: 14px;
                color: var(--paper);
                font-size: 15px;
                cursor: pointer;
                transition: background 0.15s ease, transform 0.1s ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: var(--vermilion);
            }

            .staticrypt-form .staticrypt-decrypt-button:active {
                transform: translateY(1px);
            }

            .lock-footer {
                margin-top: 22px;
                font-family: "Space Grotesk", sans-serif;
                font-size: 0.72em;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                color: var(--indigo);
                opacity: 0.7;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--paper);
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid var(--gold);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
