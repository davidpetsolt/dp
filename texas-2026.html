<html class="staticrypt-html">

        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid #d8c9a3;
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #f2e8d5;
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 45px 40px;
                text-align: center;
                border: 1px solid #1b2a4a;
                box-shadow: 0 0 0 5px #f2e8d5, 0 0 0 6px #9c2b2b, 0 10px 30px 0 rgba(27, 42, 74, 0.35);
            }

            .staticrypt-star {
                color: #c9a24b;
                font-size: 1.4em;
                letter-spacing: 0.5em;
                margin-bottom: 0.3em;
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box;
                font-family: "Zilla Slab", serif;
                font-size: 15px;
                outline: 0;
                padding: 15px 30px 15px 15px;
                width: 100%;
                color: #2a2016;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #ffffff;
                width: 100%;
                border: 1px solid #5a3e28;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                letter-spacing: 0.12em;
                outline: 0;
                background: #9c2b2b;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #f2e8d5;
                font-family: "Zilla Slab", serif;
                font-weight: 600;
                font-size: 14px;
                cursor: pointer;
                transition: background 0.15s ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #c4622d;
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: #e8dbc0;
                background-image:
                    radial-gradient(ellipse at top left, rgba(196,98,45,0.10), transparent 55%),
                    radial-gradient(ellipse at bottom right, rgba(27,42,74,0.10), transparent 55%);
                font-family: "Zilla Slab", serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -0.5em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-family: "Rye", cursive;
                font-size: 2.4em;
                color: #1b2a4a;
                letter-spacing: 0.03em;
                margin-bottom: 0.15em;
                text-shadow: 1px 1px 0 #e8dbc0, 2px 2px 0 rgba(156,43,43,0.25);
            }

            .staticrypt-instructions p:last-child {
                color: #5a3e28;
                font-size: 0.95em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
                font-family: "Zilla Slab", serif;
                font-size: 0.9em;
                color: #5a3e28;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.4);
                margin-right: 1em;
                accent-color: #9c2b2b;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #e8dbc0;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid #9c2b2b;
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
