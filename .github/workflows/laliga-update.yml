name: LaLiga standings update

on:
  schedule:
    # Three ticks/day: GitHub drops scheduled runs under load (two morning
    # crons skipped 27/28-Aug-2026), and commit-if-changed makes extras free.
    - cron: '30 4 * * *'    # 06:30 Barcelona — morning catch-all
    - cron: '45 12 * * *'   # 14:45 Barcelona — midday recovery tick
    - cron: '50 22 * * *'   # 00:50 Barcelona — same-night results, all kickoffs done
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write
  issues: write   # unmatched-team-name alerts

concurrency:
  group: laliga-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Build laliga-standings.json
        env:
          FD_TOKEN: ${{ secrets.FD_TOKEN }}
        run: node scripts/laliga-standings.js

      # A feed renaming a club silently drops its rows (Depor, Aug-2026).
      # Surface it: one open issue, updated with a comment on later runs.
      - name: Alert on unmatched team names
        if: ${{ hashFiles('unmatched.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="LaLiga feed: unmatched team names"
          BODY="A data feed is using team names the standings script cannot map — their rows are being DROPPED from laliga-standings.json until NAME_MAP / ESPN_*_MAP in scripts/laliga-standings.js learns the new names.

          Unmatched on $(date -u +%d-%b-%Y):
          \`\`\`
          $(cat unmatched.txt)
          \`\`\`"
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          rm -f unmatched.txt   # never let it reach the commit step

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain laliga-standings.json)" ]; then
            git config user.name "laliga-bot"
            git config user.email "actions@users.noreply.github.com"
            git add laliga-standings.json
            git commit -m "Update LaLiga standings $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && exit 0
              echo "push rejected, remote moved; retry $i"; sleep 5
            done
            echo "push still failing after retries"; exit 1
          else
            echo "No change to laliga-standings.json; nothing to commit."
          fi
